name: Bootstrap Kubernetes Platform


on:

  workflow_dispatch:

 
jobs:

  deploy-aws-load-balancer-controller:

    uses: ./.github/workflows/helm-deploy.yml

    with:

      service: aws-load-balancer-controller

      namespace: kube-system

      chart: aws-load-balancer-controller

      repository: https://aws.github.io/eks-charts

      repo_name: aws

      wait_for_ready: "true"

      extra_values: >
        --set clusterName=ai-analytics-copilot
        --set serviceAccount.create=true
        --set serviceAccount.name=aws-load-balancer-controller
       
    secrets: inherit

  ingress-nginx:

    uses: ./.github/workflows/helm-deploy.yml

    needs:

      - deploy-aws-load-balancer-controller

    with:

      service: ingress-nginx

      namespace: ingress-nginx

      deployment_name: ingress-nginx-controller

      chart: ingress-nginx

      repository: https://kubernetes.github.io/ingress-nginx

      values: helm/values/infrastructure/ingress-nginx.yaml

      wait_for_ready: "true"


    secrets: inherit


  metrics-server:

    uses: ./.github/workflows/helm-deploy.yml

    needs:

      - ingress-nginx

    with:

      service: metrics-server

      namespace: kube-system

      chart: metrics-server

      repository: https://kubernetes-sigs.github.io/metrics-server/

    secrets: inherit
  
  deploy-prometheus:

    uses: ./.github/workflows/helm-deploy.yml

    needs:

      - metrics-server

    with:

      service: prometheus

      namespace: monitoring

      chart: kube-prometheus-stack

      repository: https://prometheus-community.github.io/helm-charts

      extra_values: >
        --set prometheus.prometheusSpec.serviceMonitorSelectorNilUsesHelmValues=false

    secrets: inherit

  
  deploy-clickhouse:

    uses: ./.github/workflows/helm-deploy.yml

    needs:

      - deploy-prometheus

    with:

      service: clickhouse

      namespace: data

      chart: clickhouse

      repository: https://charts.bitnami.com/bitnami

      repo_name: bitnami

      values: helm/values/data/clickhouse.yaml

      wait_for_ready: "true"

    secrets: inherit


  clickhouse-init:

      uses: ./.github/workflows/kubectl-apply.yml

      needs:

        - deploy-clickhouse

      with:

        namespace: data

        manifests: |
          helm/jobs/clickhouse-init/configmap.yaml
          helm/jobs/clickhouse-init/job.yaml

      secrets: inherit


  clickhouse-seed:

    uses: ./.github/workflows/kubectl-apply.yml

    needs:

      - clickhouse-init

    with:

      namespace: data

      image_tag: v1.0.0

      manifests: |
        helm/jobs/clickhouse-seed/configmap.yaml
        helm/jobs/clickhouse-seed/job.yaml

    secrets: inherit

  deploy-opensearch:

    uses: ./.github/workflows/helm-deploy.yml

    needs:

      - deploy-clickhouse


    with:

      service: opensearch

      namespace: search

      chart: opensearch

      repository: https://opensearch-project.github.io/helm-charts/

      repo_name: opensearch

      values: helm/values/data/opensearch.yaml

      wait_for_ready: "true"


    secrets: inherit

  opensearch-init:

    uses: ./.github/workflows/kubectl-apply.yml


    needs:

      - deploy-opensearch


    with:

      namespace: search


      manifests: |

        helm/jobs/opensearch-init/configmap.yaml

        helm/jobs/opensearch-init/job.yaml


    secrets: inherit


  deploy-llm:

    needs:

      - deploy-opensearch

    uses: ./.github/workflows/helm-deploy.yml

    with:

      service: ollama

      namespace: ai-analytics

      chart: application

      values: helm/values/llm/ollama.yaml

    secrets: inherit

  load-ollama-model:

    needs: 

      - deploy-ollama

    uses: ./.github/workflows/kubectl-apply.yml

    with:
      namespace: ai-analytics

      manifests: |
        helm/jobs/ollama-init/job.yaml

    secrets: inherit