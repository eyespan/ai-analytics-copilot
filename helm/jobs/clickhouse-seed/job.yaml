apiVersion: batch/v1
kind: Job

metadata:
  name: clickhouse-seed

spec:

  ttlSecondsAfterFinished: 300

  backoffLimit: 3

  template:

    spec:

      restartPolicy: Never

      containers:

        - name: clickhouse-seed

          image: ${ECR_REGISTRY}/clickhouse-seed:${IMAGE_TAG}

          env:

            - name: CH_HOST
              value: clickhouse

            - name: CH_PORT
              value: admin

            - name: CLICKHOUSE_PASSWORD
              value: admin123

          command:
            - python

          args:
            - /scripts/ingest_clickhouse.py


          volumeMounts:

            - name: seed-script
              mountPath: /scripts


      volumes:

        - name: seed-script