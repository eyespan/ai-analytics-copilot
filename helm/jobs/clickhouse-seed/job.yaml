apiVersion: batch/v1
kind: Job

metadata:
  generateName: clickhouse-seed-

spec:

  backoffLimit: 3

  template:

    spec:

      restartPolicy: Never

      containers:

        - name: clickhouse-seed

          image: ${ECR_REGISTRY}/clickhouse-seed:${IMAGE_TAG}

          env:

            - name: CLICKHOUSE_HOST
              value: clickhouse

            - name: CLICKHOUSE_USER
              value: admin

            - name: CLICKHOUSE_PASSWORD
              value: admin123

          command:
            - python

          args:
            - /scripts/ingest_clickhouse.py


          volumeMounts:

            - name: seed-script
              mountPath: /scripts


      volumes:

        - name: seed-script

          configMap:

            name: clickhouse-seed-script