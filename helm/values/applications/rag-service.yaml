namespace: ai-analytics

name: rag-service

image:
  name: rag-service
  tag: v1.0.0
  pullPolicy: Always

replicaCount: 1

containerPort: 8001

env:
  OPENSEARCH_HOST: opensearch-cluster-master.search.svc.cluster.local

service:
  port: 80
  targetPort: 8001

resources:

  requests:
    cpu: 250m
    memory: 512Mi

  limits:
    cpu: 1
    memory: 1Gi


ingress:

  enabled: false