namespace: ai-analytics

name: frontend

image:
  name: frontend
  tag: v1.0.0
  pullPolicy: Always

replicaCount: 2

containerPort: 3000

service:
  port: 80

env:
   ORCHESTRATOR_URL: http://orchestrator-service.ai-analytics.svc.cluster.local

resources:

  requests:
    cpu: 100m
    memory: 128Mi

  limits:
    cpu: 500m
    memory: 512Mi

ingress:

  enabled: true

  path: /

  rewrite: false

readinessProbe:
  httpGet:
    path: /
    port: 3000
  initialDelaySeconds: 5
  periodSeconds: 10

livenessProbe:
  httpGet:
    path: /
    port: 3000
  initialDelaySeconds: 15
  periodSeconds: 20