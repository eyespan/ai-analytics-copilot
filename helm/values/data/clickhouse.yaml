global:
  security:
    allowInsecureImages: true


replicaCount: 1

image:
  registry: docker.io
  repository: bitnamilegacy/clickhouse
  tag: "25.7.5-debian-12-r0"

keeper:
  image:
    registry: docker.io
    repository: bitnamilegacy/clickhouse-keeper
    tag: "25.7.5-debian-12-r0"

auth:
  username: admin
  password: admin123
  database: github

persistence:
  enabled: true
  storageClass: gp3
  size: 50Gi

resources:
  requests:
    cpu: 500m
    memory: 2Gi
  limits:
    cpu: 2
    memory: 4Gi

service:
  type: ClusterIP


