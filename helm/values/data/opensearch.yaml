clusterName: opensearch

nodeGroup: master

replicas: 1

singleNode: true

opensearchJavaOpts: "-Xms1g -Xmx1g"

resources:
  requests:
    cpu: 500m
    memory: 2Gi

  limits:
    cpu: 2
    memory: 4Gi


persistence:
  enabled: true

  storageClass: gp3

  size: 50Gi


securityConfig:
  enabled: true


extraEnvs:
  - name: OPENSEARCH_INITIAL_ADMIN_PASSWORD
    value: "Opensearch2026!Aa"


service:
  type: ClusterIP


plugins:
  enabled: true